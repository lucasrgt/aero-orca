[[card]]
id = "snooze-or-settle-a-chat-it-leave-e29ba3"
title = "Snooze or settle a chat: it leaves the tab strip and comes back by itself when it needs me"
desc = """
Story: as the user, I want to park chats I am waiting on (snooze 1 h, until tonight, until tomorrow 09:00, or settle indefinitely) without closing them, and have them return on their own when they ask me something.

Today (observed 2026-11-11): `isPinned` only means \"in the open-tab strip\" and src/idleTabs.ts auto-closes idle tabs after N days; there is no snooze, no manual settle, no wake-on-event. Idea from herdr `tab.settle` and herdr-layout-examples threads/ (t4-threads: snooze, settle shelves, wake early on blocked/done).

Acceptance:
- Given an open tab, when the user snoozes it (1 h / tonight 19:00 / tomorrow 09:00) or settles it, then it leaves the strip and appears in a \"Snoozed\" or \"Settled\" shelf in the sidebar with its wake time; it keeps running.
- Given a snoozed or settled session starts asking or errors, then it returns to the strip at once with its attention marker.
- Given a snooze time passes, then the tab returns to the strip.
- Given a settled session, then it is never deleted and stays searchable.
- The per-session `snoozedUntil` / `settled` state is persisted with the session (sessions.rs) and the wake rule is a pure helper next to idleTabs.ts with a runnable check; English strings via i18n; manual page updated; tsc passes.

Depends on the attention-model card (uses its asking/done state). Effort S-M. Source: herdr study 65935125."""
