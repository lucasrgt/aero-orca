reason = "checks.test is not configured, so no test run can back the binding"

[card.spec]
story = "As a Portuguese-speaking user, I want the sidebar, session tabs, composer and chat thread to show Brazilian Portuguese text when that interface language is selected, so that I can use these surfaces in my language."
refined_at = "2026-11-12T23:06:08.248646600+00:00"
text_hash = "59ef0c257f8168a7"
assumptions = ["The i18n foundation card has landed, so t() and the en and pt-BR key files already exist; I will reuse them and add keys for these surfaces.", "Brand names and technical identifiers (such as Aero, file names, model names) stay as they are and do not count as English copy.", "Verification is the build command npm ci && npx tsc --noEmit, plus a check that en and pt-BR keys match for these surfaces.", "Work is limited to the four named surfaces; other views are covered by the sibling rollout cards.", "Estimated effort is about 75 minutes, which fits one run."]

[card.spec.assumptions_tr]
lang = "pt-BR"
items = ["A fundação de i18n já foi concluída, então t() e os arquivos de chaves en e pt-BR já existem; vou reutilizá-los e adicionar chaves para estas superfícies.", "Nomes de marcas e identificadores técnicos (como Aero, nomes de arquivos e nomes de modelos) permanecem como estão e não contam como texto em inglês.", "A verificação é o comando de build npm ci && npx tsc --noEmit, mais uma checagem de que as chaves en e pt-BR coincidem para estas superfícies.", "O trabalho se limita às quatro superfícies citadas; as outras telas são cobertas pelos cards irmãos da implantação.", "O esforço estimado é de cerca de 75 minutos, o que cabe em uma execução."]

[[card.spec.acceptance]]
given = "the interface language is set to Português do Brasil"
when = "I view the sidebar, session tabs, composer and chat thread"
then = "no English UI copy appears on these surfaces, apart from brand names and technical identifiers"

[[card.spec.acceptance]]
given = "the interface language is set to English"
when = "I view the same surfaces"
then = "the text is unchanged in meaning from before the change"

[[card.spec.acceptance]]
given = "the en and pt-BR translation files are compared"
when = "the strings for these surfaces are checked"
then = "every key used on these surfaces exists in both languages"

[[card.spec.acceptance]]
given = "the change is complete"
when = "npx tsc --noEmit is run"
then = "it passes with no errors"
