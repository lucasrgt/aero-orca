[[card]]
id = "match-whole-word-todo-fixme-in-a-489788"
title = "Match whole-word TODO/FIXME in Autopilot suggest signals"
desc = """
[src: gh/owner/repo#55]
Suggested by Autopilot from src-tauri/src/autopilot_suggest.rs:265.
Found: if no.parse::<u32>().is_err() || !(text.contains(\"TODO\") || text.contains(\"FIXME\")) {

The suggest-signal filter in src-tauri/src/autopilot_suggest.rs (around line 265) checks `text.contains(\"TODO\")`, so it also matches Portuguese words like \"TODOS\" (\"all\") in comments such as those in src/components.tsx and src/7-adapt.css. Change the check to match TODO and FIXME only as whole words, and make the git grep pattern at line 505 agree with it. Add cases to the existing `todo_signals` test (around lines 669-677) asserting that a line containing \"TODOS os\" yields no signal while \"// TODO: handle\" and \"FIXME later\" still do. Done when `cargo test` passes for autopilot_suggest and the new assertions cover the \"TODOS\" case."""
