title = "A new prompt fragment is inert until prompt::seed registers it"
lesson = 'A Goal Mode test failed after the new `prompt/mode/goal.md` file was added because `prompt::fragment("mode/goal")` returned an empty string. Prompt files are not discovered dynamically: every shipped seed must also be registered in `prompt.rs::seed` with `include_str!`. When adding a prompt fragment, add the file, register its exact key, and keep an assembly test that asserts a distinctive marker from the real body.'
