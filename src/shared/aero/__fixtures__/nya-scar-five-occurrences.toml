title = "Windows console suppression must not allocate hidden consoles or steal foreground"
lesson = "On Windows, console suppression must cover repository work performed by the GUI host, the provider tree, and every configured MCP command without allocating even a hidden console. CREATE_NEW_CONSOLE plus SW_HIDE can still change foreground ownership and minimize exclusive-fullscreen games; provider and MCP roots must use CREATE_NO_WINDOW while retaining inherited pipes and the job-object lifecycle. Rewrite Codex MCP commands through the AeroFortress consoleless wrapper. Resolve npm commands to .exe before .cmd/.bat; batch and explicit cmd.exe servers must run through the consoleless system cmd.exe. Process-scoped GUI-subsystem shims must force separately launched helpers into CREATE_NO_WINDOW, preserve the original cwd, environment, arguments, streams, and exit code, and restore inherited standard handles if AttachConsole ever succeeds. Any Git command spawned directly by the main process or an embedded library is outside the provider tree and must set CREATE_NO_WINDOW independently. Never replace user binaries or mutate the machine PATH. Tests must prove no distinct console is allocated: GetConsoleWindow is null under the production GUI wrapper; a console-subsystem test runner may pass only its exact preexisting parent handle to the child. Checking only IsWindowVisible is insufficient because an invisible newly allocated console may still steal focus. Release the job on normal root exit so intentional long-lived descendants can survive. An updater must terminate the full AeroFortress descendant tree before replacing the running executable, because orphaned Codex and MCP children can retain the binary lock."
